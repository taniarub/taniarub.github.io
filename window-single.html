<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window SVG</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        
        .window-frame {
            width: 300px;
            height: 400px;
            background-color: #fff;
            border: 15px solid #e6e6e6;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .window-glass {
            width: 100%;
            height: 100%;
            background-color: #7eb7ff;
            display: flex;
            flex-direction: column;
        }
        
        .window-handle {
            position: absolute;
            width: 8px;
            height: 30px;
            background-color: #999;
            border-radius: 4px;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .window-handle:after {
            content: '';
            position: absolute;
            width: 16px;
            height: 8px;
            background-color: #999;
            border-radius: 4px;
            top: 50%;
            left: -4px;
            transform: translateY(-50%);
        }
    </style>
</head>
<body>
    <div class="window-frame">
        <div class="window-glass"></div>
        <div class="window-handle"></div>
    </div>
</body>
</html>
