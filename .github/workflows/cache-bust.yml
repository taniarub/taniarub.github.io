name: Cache Bust

on:
  push:
    branches:
      - main

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}  # 改為使用 PAT Token

      - name: Replace version hash
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          sed -i "s/{{COMMIT_SHA}}/$COMMIT_SHA/g" index.html

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Auto update cache-busting hash [ci skip]" || echo "No changes to commit"
          git push origin main