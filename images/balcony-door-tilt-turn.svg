<svg width="150" height="200" viewBox="0 0 150 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .frame { fill: #f0f0f0; stroke: #333; stroke-width: 4; }
      .glass { fill: #cce7ff; stroke: #333; stroke-width: 2; }
      .panel { fill: #e0e0e0; stroke: #333; stroke-width: 2; }
      .handle { fill: #555; }
      .opening-indicator { stroke: #ff6600; stroke-width: 2; stroke-dasharray: 4 2; fill: none; }
      .arrowhead { fill: #ff6600; }
    </style>
  </defs>

  <!-- Door Frame -->
  <rect x="10" y="10" width="130" height="180" class="frame" rx="5" ry="5"/>

  <!-- Glass Area -->
  <rect x="20" y="20" width="110" height="120" class="glass" />

  <!-- Bottom Panel -->
  <rect x="20" y="145" width="110" height="35" class="panel" />

  <!-- Handle -->
  <rect x="25" y="90" width="10" height="20" class="handle" rx="2" ry="2"/>

  <!-- Opening Indicators -->
  <!-- Turn Indicator -->
  <path d="M 20 100 A 80 80 0 0 1 80 25" class="opening-indicator"/>
  <polygon points="75,20 85,25 75,30" class="arrowhead"/>

  <!-- Tilt Indicator -->
  <path d="M 75 20 L 100 5" class="opening-indicator"/>
  <polygon points="95,0 105,5 95,10" class="arrowhead"/>

</svg>