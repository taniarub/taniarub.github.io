<svg width="120" height="100" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Window frame (thick, rectangular, with shadow) -->
  <rect x="20" y="18" width="80" height="60" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="6"/>
  <!-- Blue glass (larger, smaller margin) -->
  <rect x="26" y="24" width="68" height="44" rx="2" fill="#7ec3f7" stroke="#4da9ff" stroke-width="2"/>
  <!-- Question mark -->
  <text x="60" y="48" text-anchor="middle" font-size="32" font-family="Arial, sans-serif" fill="#234" font-weight="bold" dominant-baseline="middle">?</text>
</svg> 