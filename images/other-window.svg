<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadow -->
  <ellipse cx="100" cy="170" rx="70" ry="12" fill="#e0e7ef"/>
  <!-- Window frame -->
  <rect x="30" y="40" width="140" height="100" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="6"/>
  <!-- Glass -->
  <rect x="45" y="55" width="110" height="70" rx="6" fill="#7ec1f7" stroke="#4da9ff" stroke-width="3"/>
  <!-- Windowsill -->
  <rect x="50" y="140" width="100" height="12" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  <!-- Question mark -->
  <text x="100" y="105" text-anchor="middle" font-size="60" font-family="Arial, sans-serif" fill="#2563eb" font-weight="bold">?</text>
</svg> 